<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notas com Erro</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --bg: #f3f5f7;
  --panel: #ffffff;
  --border: #dde3ea;
  --text: #1c2733;
  --text-mute: #647082;
  --primary: #1f5f8b;
  --primary-dark: #164a6e;
  --danger: #c1462f;
  --accent: #2f9e6e;
  --radius: 10px;
}
html, body{
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
.container{ max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }

header.app-header{ margin-bottom: 20px; }
header.app-header h1{ font-size: 1.4rem; font-weight: 700; color: var(--primary-dark); }
header.app-header p{ color: var(--text-mute); margin-top: 4px; font-size: 0.9rem; }

.summary-bar{
  display: flex; align-items: center; justify-content: space-between;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; margin-bottom: 18px;
}
.summary-bar .count{ font-size: 1.3rem; font-weight: 700; color: var(--primary-dark); }
.summary-bar .label{ color: var(--text-mute); font-size: 0.82rem; }
.summary-bar .status{ font-size: 0.78rem; color: var(--text-mute); }
.summary-bar .status.ok::before{ content: "\25CF "; color: var(--accent); }
.summary-bar .status.err::before{ content: "\25CF "; color: var(--danger); }

.msg{
  border-radius: 8px; padding: 12px 14px; font-size: 0.88rem; margin-bottom: 14px; display: none;
}
.msg.visible{ display: block; }
.msg-error{ background: #fdf1ee; color: var(--danger); border: 1px solid #f2d3c9; }
.msg-success{ background: #eefaf3; color: #1f7a4d; border: 1px solid #bfe8d3; }

.empty-state{
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 40px 20px; text-align: center; color: var(--text-mute); font-size: 0.9rem;
}

.card-list{ display: flex; flex-direction: column; gap: 12px; }
.card{
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px;
}
.card .row-top{ display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.card .filename{ font-weight: 700; font-size: 0.95rem; word-break: break-word; }
.card .date{ font-size: 0.76rem; color: var(--text-mute); white-space: nowrap; }
.card .error-msg{
  margin-top: 8px; font-size: 0.85rem; color: var(--danger);
  background: #fdf1ee; border: 1px solid #f2d3c9; border-radius: 6px; padding: 8px 10px;
}
.card .actions{ display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

button, a.btn{
  font-family: inherit; font-size: 0.84rem; font-weight: 600; border-radius: 7px;
  border: 1px solid transparent; padding: 8px 14px; cursor: pointer;
  text-decoration: none; display: inline-block;
}
.btn-primary{ background: var(--primary); color: #fff; }
.btn-primary:hover{ background: var(--primary-dark); }
.btn-danger{ background: #fff; color: var(--danger); border-color: var(--danger); }
.btn-danger:hover{ background: #fdf1ee; }
.btn-danger:disabled{ opacity: 0.5; cursor: not-allowed; }

footer.app-footer{ text-align: center; color: var(--text-mute); font-size: 0.76rem; margin-top: 30px; }
</style>
</head>
<body>
<div class="container">

  <header class="app-header">
    <h1>Notas com Erro</h1>
    <p>PDFs de NF-e que não puderam ser processados automaticamente — revise e corrija por aqui.</p>
  </header>

  <div class="summary-bar">
    <div>
      <div class="count" id="count">—</div>
      <div class="label">nota(s) pendente(s)</div>
    </div>
    <div class="status" id="connStatus">Conectando...</div>
  </div>

  <div class="msg msg-error" id="msgError"></div>
  <div class="msg msg-success" id="msgSuccess"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    Nenhuma nota com erro no momento. 🎉
  </div>

  <div class="card-list" id="cardList"></div>

  <footer class="app-footer">
    Painel de consulta &middot; conectado ao mesmo Firebase do extrator de NF-e e do RecebeMais
  </footer>

</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO DO FIREBASE
   Mesmo projeto usado pelo extrator de NF-e e pelo RecebeMais.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBTjq1CzNj_wm6xwFLDEUbGGYNpFDxfe6A",
  authDomain: "recebemais-340ea.firebaseapp.com",
  projectId: "recebemais-340ea",
  storageBucket: "recebemais-340ea.firebasestorage.app",
  messagingSenderId: "154000900066",
  appId: "1:154000900066:web:677ed6caeeb633cc1783bb",
};
const COLECAO = "notas_com_erro";

let db = null;

function init(){
  if (typeof firebase === "undefined"){
    showError("A biblioteca do Firebase não carregou (verifique sua conexão com a internet).");
    setConnStatus(false, "Sem conexão com o Firebase");
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    setConnStatus(true, "Conectado");
    escutarNotas();
  } catch (err){
    console.error(err);
    showError("Não foi possível conectar ao Firebase.");
    setConnStatus(false, "Erro de conexão");
  }
}

function setConnStatus(ok, texto){
  const el = document.getElementById("connStatus");
  el.textContent = texto;
  el.className = "status " + (ok ? "ok" : "err");
}

/* =====================================================================
   ESCUTA EM TEMPO REAL DA COLEÇÃO "notas_com_erro"
   ===================================================================== */
function escutarNotas(){
  db.collection(COLECAO).orderBy("criadoEm", "desc").onSnapshot(
    (snapshot) => {
      const notas = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
      renderNotas(notas);
    },
    (err) => {
      console.error(err);
      showError("Não foi possível carregar as notas com erro. Verifique as regras de acesso do Firestore.");
    }
  );
}

let notasAtual = [];

function renderNotas(notas){
  notasAtual = notas;
  const list = document.getElementById("cardList");
  const empty = document.getElementById("emptyState");
  const count = document.getElementById("count");

  count.textContent = notas.length;
  list.innerHTML = "";

  if (!notas.length){
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  notas.forEach((nota) => {
    const card = document.createElement("div");
    card.className = "card";

    const dataStr = formatarData(nota.criadoEm);

    card.innerHTML = `
      <div class="row-top">
        <div class="filename">${escapeHTML(nota.fileName || "(sem nome)")}</div>
        <div class="date">${dataStr}</div>
      </div>
      ${nota.errorMsg ? `<div class="error-msg">${escapeHTML(nota.errorMsg)}</div>` : ""}
      <div class="actions">
        ${nota.pdfUrl ? `<a class="btn btn-primary" href="${escapeAttr(nota.pdfUrl)}" target="_blank" rel="noopener">Abrir PDF</a>` : ""}
        <button class="btn-danger" data-id="${escapeAttr(nota.id)}">Marcar como corrigida</button>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll("button[data-id]").forEach((btn) => {
    btn.addEventListener("click", () => removerNota(btn.dataset.id, btn));
  });
}

/* =====================================================================
   REMOÇÃO — apaga o registro no Firestore quando o
   usuário marca a nota como já corrigida.
   ===================================================================== */
async function removerNota(id, btn){
  const confirmado = confirm("Marcar esta nota como corrigida? Ela será removida desta lista.");
  if (!confirmado) return;

  btn.disabled = true;
  clearMessages();
  try{
    await db.collection(COLECAO).doc(id).delete();
    showSuccess("Nota removida da lista.");
  } catch (err){
    console.error(err);
    showError("Não foi possível remover esta nota. Tente novamente.");
    btn.disabled = false;
  }
}

/* =====================================================================
   AUXILIARES
   ===================================================================== */
function formatarData(timestamp){
  if (!timestamp || typeof timestamp.toDate !== "function") return "";
  const d = timestamp.toDate();
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function escapeHTML(str){
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(str){
  return escapeHTML(str).replace(/"/g, "&quot;");
}
function clearMessages(){
  ["msgError", "msgSuccess"].forEach((id) => {
    const el = document.getElementById(id);
    el.classList.remove("visible");
    el.textContent = "";
  });
}
function showError(text){
  clearMessages();
  const el = document.getElementById("msgError");
  el.textContent = text;
  el.classList.add("visible");
}
function showSuccess(text){
  const el = document.getElementById("msgSuccess");
  el.textContent = text;
  el.classList.add("visible");
}

init();
</script>
</body>
</html>
